name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.9.6
      - run: ruff check src tests scripts services
      - run: ruff format --check src tests services

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: web (next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Pages are force-dynamic, so the build needs no running API: it compiles
      # and typechecks the frontend, and a broken contract with services/api
      # fails here rather than in the browser.
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t carbon-scheduling:ci .
      # The image is the scheduler only; the visualization backend lives in
      # its own image, so its tests run in the host `test` job instead.
      - name: Run test suite inside the image
        run: docker run --rm carbon-scheduling:ci python -m pytest -q --ignore=tests/test_api_service.py
