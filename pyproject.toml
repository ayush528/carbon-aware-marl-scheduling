[project]
name = "carbon-scheduling"
version = "0.1.0"
description = "Uncertainty-aware decentralized multi-agent RL for carbon-aware workload scheduling across geo-distributed data centers"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
