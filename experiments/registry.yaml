# Experiment registry -- human-readable index of every experiment.
# The executable registry lives in src/carbon_scheduling/experiments/__init__.py.
# status: draft | merged | superseded
# rollback_tag is created when the experiment's config + results are merged to main.

experiments:
  - id: exp001-uk-carbon-baseline
    title: Baseline statistics of NESO national carbon intensity, Jan 2025
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp001-uk-carbon-baseline
    description: >
      Deterministic summary (mean/median/stdev/min/max, forecast-vs-actual MAE)
      of half-hourly national carbon intensity for January 2025 from the NESO
      Carbon Intensity API. Reference fixture for Phase 1 (data freeze):
      every future re-pull of the same window must reproduce these numbers.
