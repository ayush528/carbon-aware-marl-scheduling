# Experiment registry -- human-readable index of every experiment.
# The executable registry lives in src/carbon_scheduling/experiments/__init__.py.
# status: draft | merged | superseded
# rollback_tag is created when the experiment's config + results are merged to main.

experiments:
  - id: exp001-uk-carbon-baseline
    title: Baseline statistics of NESO national carbon intensity, Jan 2025
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp001-uk-carbon-baseline
    description: >
      Deterministic summary (mean/median/stdev/min/max, forecast-vs-actual MAE)
      of half-hourly national carbon intensity for January 2025 from the NESO
      Carbon Intensity API. Reference fixture for Phase 1 (data freeze):
      every future re-pull of the same window must reproduce these numbers.

  - id: exp002-neso-regional-pull
    title: Live NESO regional pull vs verified audit sample (London, 2025 week 1)
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp002-neso-regional-pull
    description: >
      First exercise of the Phase 1 regional puller: fetch London (region 13)
      for the first week of January 2025 live from the NESO API and diff it
      against the committed audit sample (the oracle). Metrics: shared-slot
      count, forecast mismatch count, mean/max absolute forecast difference.

  - id: exp003-regional-matrix-check
    title: 14-region Jan-2025 matrix validation + the regional-actuals gap
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp003-regional-matrix-check
    description: >
      Validates the 14-region x January-2025 tidy-CSV matrix against the
      audit samples (grid shape, London forecast consistency across
      endpoints, verified literals) and pins the Phase 1 finding that the
      NESO regional endpoint ships no actual intensities -- regional
      actuals must be estimated by national scaling (disclosed).

  - id: exp004-conformal-bands
    title: Split-conformal bands -- calibrate Jan 2025, coverage on held-out Feb 2025
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp004-conformal-bands
    description: >
      The Phase 1 exit test. Finite-sample-corrected split conformal on
      national forecast residuals: calibrate on January 2025 (alpha = 0.1,
      target coverage 90%), evaluate empirical coverage and MAE on the
      held-out month (February 2025).

  - id: exp005-regional-bands
    title: Regional conformal bands via national scaling -- calibrate Jan, hold-out Feb per region
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp005-regional-bands
    description: >
      Completes the uncertainty layer. Per DNO region (1-14): residuals
      under the national-scaling estimator (regional residual = national
      residual x forecast ratio, exact identity -- regional API ships no
      actuals, exp003), band calibrated on January 2025, coverage evaluated
      on held-out February 2025. Target 90% per region.

  - id: exp006-azure-trace-demand
    title: Azure LLM trace demand stream -- loader validation on the real 1-week sample
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp006-azure-trace-demand
    description: >
      Streams the full 1-week Azure LLM inference trace (16.8M requests)
      through the demand loader and records the per-half-hour demand shape:
      span, mean/peak arrivals per slot, token workload. Pins the loader
      against the real file; demand input envelope for the Phase 2
      simulator.

  - id: exp007-site-energy
    title: Site energy envelope -- real demand stream through the cluster model
    phase: "2-simulator"
    status: merged
    rollback_tag: exp/exp007-site-energy
    description: >
      Streams the full Azure LLM trace through the cluster energy model
      (NLR idle->peak per GPU, Google-prior PUE, disclosed throughput
      knob) for one London-sized site. Records the energy envelope:
      utilization distribution, saturated slots, energy per request
      (sanity range vs DynamoLLM/TAPAS magnitudes).

  - id: exp008-sustaincluster-baseline
    title: SustainCluster as-is -- rule-based baselines and shipped SAC checkpoints
    phase: "2-simulator"
    status: draft
    rollback_tag: null
    description: >
      Runs upstream SustainCluster unmodified (their 5 sites, their carbon
      data, 7 days, seed 42) through in-repo headless drivers: 5 rule-based
      controllers plus all 4 shipped SAC checkpoints. Reference point for the
      NESO substitution. Finding: no SAC checkpoint beats lowest_carbon on
      carbon, and every SAC checkpoint violates 27-48% of task SLAs because
      upstream's reward config leaves the timeliness penalty commented out.

  - id: exp009-uk-sites
    title: SustainCluster on four UK sites -- NESO regional carbon, Elexon prices
    phase: "2-simulator"
    status: draft
    rollback_tag: null
    description: >
      Re-runs exp008's unmodified simulator code but swaps in four UK sites
      (London, South Wales, North West England, South Scotland) fed by real
      NESO regional carbon and real GB wholesale prices (Elexon MID, GBP->USD
      at the ECB 2024 mean). Phase 2 exit test: the per-site intensity implied
      by the simulator's own accounting matches the input series over the
      window it actually read (max error 0.77 gCO2/kWh), the site ordering
      matches, and lowest_carbon cuts carbon 6.9% vs round_robin at 0.1% SLA.
      The workload clock is aligned onto the simulator's jittered data window
      so demand and carbon are the same week.

  - id: exp010-rolling-bands
    title: Rolling-origin conformal bands on 2024 (calibrate 28 days before each month)
    phase: "2-simulator"
    status: draft
    rollback_tag: null
    description: >
      Replaces exp004/exp005's single Jan->Feb split with walk-forward
      evaluation on 2024. Every month is calibrated on the 28 days before it
      and evaluated on itself, so the coverage number is what an online
      scheduler could achieve, and 12 months x 14 DNO regions give 168 cells
      instead of one. Compares the national-relative band (half-width =
      forecast x q) against exp005's per-region constant band, and quantifies
      the decision effect: a proportional band cannot reorder regions, but it
      raises the carbon-gap ratio a risk-averse rule needs from "any gap" to
      (1-q)/(1+q).

  - id: exp011-band-dispatch
    title: Band-aware dispatch on four real UK regions (Phase 3, rung 4)
    phase: "3-agents"
    status: draft
    rollback_tag: null
    description: >
      First experiment where the calibrated band is an input to a decision: a
      capacity-aware carbon-greedy dispatcher runs over the real Azure LLM week
      (2024-05-10..17) on the four UK regions from exp009, driven by NESO's
      regional forecast and scored against realized intensity. Bands are
      calibrated on the 28 days before the week (no leakage). Result, reported
      as a negative result: a pooled relative band is provably and empirically
      decision-invariant (0 of 336 slots change, carbon identical), and a
      per-region absolute band does reorder sites but only ever costs carbon
      (+0.02..0.07%), because under the national-scaling estimator realized
      intensity is a per-slot monotone transform of the forecast, so the
      regional ordering is known exactly and oracle equals forecast-greedy.
      The band's decision value therefore has to come from level/timing risk
      (deadlines, CVaR), not from site ranking -- which sets the Phase 3 design.

  - id: exp012-rl-dispatch
    title: PPO dispatch with and without the band -- held-out 2024 weeks
    phase: "3-agents"
    status: draft
    rollback_tag: null
    description: >
      Rung 5: the first learned agent. PPO (numpy, in-repo, gradients verified
      against finite differences) over a weekly environment where each action is
      a risk level (fill every site cheapest-first by forecast + lam*band, with
      spill) or a wait; every task carries a deadline. Trained on 2024 weeks from
      January to September, evaluated greedily on October-December, with the
      calibrated band taken from the 28 days before each episode. Result: with a
      one-kilo-per-GPU-hour deadline penalty the agent converges to immediate
      carbon-greedy dispatch (+0.02% vs run_now), the deadline-aware rule buys
      3.0% carbon for +10pp SLA violations, and putting the band in the
      observation changes held-out carbon by 0.01% -- i.e. no effect. Reported as
      the honest outcome: at this fleet size and penalty, uncertainty changes
      risk reporting, not carbon.

  - id: exp013-marl-dispatch
    title: Decentralized dispatch -- IPPO/MAPPO, communication, and the price of a missed deadline
    phase: "3-agents"
    status: draft
    rollback_tag: null
    description: >
      Rung 6. One PPO agent per region quotes a risk level (its own forecast +
      lam*band) and, under a service obligation, offers its slot capacity or
      waits; an untrained rule clears the cheapest bids with spill. Variants
      (IPPO, no communication, a CVaR tail term, MAPPO with a centralised
      critic, and a market variant that may decline work) crossed with three
      deadline prices and two fleet sizes, trained Jan-Sep 2024 and evaluated on
      12 held-out Oct-Dec weeks. The prices bracket the parity price of 0.093 kg
      per GPU-hour that serving work emits: 0.02 (below it, a control), 0.1 (at
      it), 1.0 (above it). At weight 0.1 the best learner cuts carbon 26.6%
      while missing 25.8% of work, and beats the best rule on its own objective
      by 9.2% (better in 12/12 weeks); at 1.0 it matches carbon-greedy to
      +0.01% and serves everything.
      The learner implements the price it is given and beats the heuristics at
      every price where a trade exists. Two negative results, both reported: a
      terminal-only CVaR charge does not move the per-slot tail (it enters one
      of 336 advantages), and communication and a centralised critic do not
      consistently help. Two earlier runs of this experiment were invalid (a
      diverging learning rate, then a holding price that double-charged delay);
      see experiments/exp013-marl-dispatch/README.md.

  - id: exp014-marl-seeds
    title: Multi-seed replication of the decentralized dispatch result
    phase: "3-agents"
    status: draft
    rollback_tag: null
    description: >
      Five training seeds x four variants (CVaR at alpha 0.8/0.9/0.95 and
      risk-neutral) x two fleets, at the parity deadline price (0.1 kg per
      missed GPU-hour against 0.093 kg emitted per GPU-hour served), always
      paired against the same carbon-greedy rule on the same 12 held-out
      Oct-Dec weeks. The direction is seed-robust: all four variants cut carbon
      in all five seeds and are better in 12/12 weeks in every seed, so this is
      not the single-seed artefact exp013's first run was. The magnitude is not:
      capacity-bound the mean cut is 40.9-42.9% (per-seed spread -24.8% to
      -60.5%, bimodal around -30% and -59%), slack 58.3-62.1%. At this price
      every arm sheds 39-41% (capacity-bound) or 49-53% (slack) of work against
      the rule's 12.8% and 0.0%, so the carbon number is inseparable from the
      service number and both are reported. The CVaR tail term has no
      measurable effect at any alpha -- means differing by at most 2 points
      against a 15-point seed spread -- which is what exp013 predicted from the
      terminal charge entering one of 336 advantages. The learning gate passes
      for 4-5 of 5 seeds per variant.

  - id: exp015-timing-headroom
    title: The value of timing -- exact perfect-foresight bound at matched service
    phase: "3-agents"
    status: draft
    rollback_tag: null
    description: >
      Measures the lever exp011 left standing. Under the national-scaling
      estimator site ranking is exactly known, so carbon-aware placement has no
      uncertainty and the oracle ties forecast-greedy; what a scheduler can
      still control is *when* work runs. For each of the 12 held-out Oct-Dec
      2024 weeks this serves the volume carbon-greedy serves and asks a min-cost
      flow (a proven optimum, not a heuristic; verified against exhaustive
      search on small instances) for the cheapest legal schedule at deadline
      horizons of 0.5 h to 24 h. At the 4-hour deadline every policy since
      exp012 uses, perfect foresight saves 29.4% on the slack fleet (40 GPUs
      per site) and 14.5% on the capacity-bound fleet (25), at identical served
      volume, better in 12/12 weeks. That gap is what the current action space
      leaves on the table: under the service obligation an agent can only
      express deferral by every agent waiting at once, which independent
      learners never coordinate on. The bound is not a policy -- it sees every
      realized intensity -- but it bounds what any causal policy could save and
      motivates the queue-owning redesign (rung 7).

  - id: exp016-queue-ownership
    title: Rung 7 -- agents own queues, so timing becomes a unilateral decision
    phase: "3-agents"
    status: draft
    rollback_tag: null
    description: >
      Rung 6 let an agent own a site, which meant deferral was only expressible
      as `wait` -- and a single agent withdrawing its capacity just let the
      coordinator spill its work, so deferral needed every agent to wait at
      once. Ownership is inverted here: each of four agents owns a work stream
      and a deadline-constrained backlog, and its only decision is what fraction
      of its own slack to coast (serve now, a third, two thirds, or hold to the
      last legal slot) before offering its queue. Deferral is then unilateral
      and a policy can express it. A coordinator still places whatever is
      offered, cheapest forecast site first, so rung 6's placement result -- the
      regional ordering is exactly known -- is preserved, and the only lever
      under test is timing. The four classes (0.5, 1, 2 and 4 hours) split the
      Azure arrivals equally, a disclosed modelling choice because the trace
      carries no latency labels; every arm sees the identical split. Each arm is
      scored against (a) four hand-written timing rules, (b) the exact
      perfect-foresight bound at the volume the immediate rule serves, and (c)
      the same bound at the arm's *own* served volume, which is what stops a
      policy from looking good by serving less. Units: 600 episodes, three
      seeds, three prices (0.1 = parity, 0.3 = the rule frontier's crossover,
      1.0 = a service obligation), two fleets; gamma 1.0 because the objective
      is the episode total, lam 0.98 and the episode count chosen on a hold-out
      slice of the training months, never on the evaluation weeks.
