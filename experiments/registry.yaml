# Experiment registry -- human-readable index of every experiment.
# The executable registry lives in src/carbon_scheduling/experiments/__init__.py.
# status: draft | merged | superseded
# rollback_tag is created when the experiment's config + results are merged to main.

experiments:
  - id: exp001-uk-carbon-baseline
    title: Baseline statistics of NESO national carbon intensity, Jan 2025
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp001-uk-carbon-baseline
    description: >
      Deterministic summary (mean/median/stdev/min/max, forecast-vs-actual MAE)
      of half-hourly national carbon intensity for January 2025 from the NESO
      Carbon Intensity API. Reference fixture for Phase 1 (data freeze):
      every future re-pull of the same window must reproduce these numbers.

  - id: exp002-neso-regional-pull
    title: Live NESO regional pull vs verified audit sample (London, 2025 week 1)
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp002-neso-regional-pull
    description: >
      First exercise of the Phase 1 regional puller: fetch London (region 13)
      for the first week of January 2025 live from the NESO API and diff it
      against the committed audit sample (the oracle). Metrics: shared-slot
      count, forecast mismatch count, mean/max absolute forecast difference.

  - id: exp003-regional-matrix-check
    title: 14-region Jan-2025 matrix validation + the regional-actuals gap
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp003-regional-matrix-check
    description: >
      Validates the 14-region x January-2025 tidy-CSV matrix against the
      audit samples (grid shape, London forecast consistency across
      endpoints, verified literals) and pins the Phase 1 finding that the
      NESO regional endpoint ships no actual intensities -- regional
      actuals must be estimated by national scaling (disclosed).

  - id: exp004-conformal-bands
    title: Split-conformal bands -- calibrate Jan 2025, coverage on held-out Feb 2025
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp004-conformal-bands
    description: >
      The Phase 1 exit test. Finite-sample-corrected split conformal on
      national forecast residuals: calibrate on January 2025 (alpha = 0.1,
      target coverage 90%), evaluate empirical coverage and MAE on the
      held-out month (February 2025).

  - id: exp005-regional-bands
    title: Regional conformal bands via national scaling -- calibrate Jan, hold-out Feb per region
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp005-regional-bands
    description: >
      Completes the uncertainty layer. Per DNO region (1-14): residuals
      under the national-scaling estimator (regional residual = national
      residual x forecast ratio, exact identity -- regional API ships no
      actuals, exp003), band calibrated on January 2025, coverage evaluated
      on held-out February 2025. Target 90% per region.

  - id: exp006-azure-trace-demand
    title: Azure LLM trace demand stream -- loader validation on the real 1-week sample
    phase: "1-data-freeze"
    status: merged
    rollback_tag: exp/exp006-azure-trace-demand
    description: >
      Streams the full 1-week Azure LLM inference trace (16.8M requests)
      through the demand loader and records the per-half-hour demand shape:
      span, mean/peak arrivals per slot, token workload. Pins the loader
      against the real file; demand input envelope for the Phase 2
      simulator.

  - id: exp007-site-energy
    title: Site energy envelope -- real demand stream through the cluster model
    phase: "2-simulator"
    status: merged
    rollback_tag: exp/exp007-site-energy
    description: >
      Streams the full Azure LLM trace through the cluster energy model
      (NLR idle->peak per GPU, Google-prior PUE, disclosed throughput
      knob) for one London-sized site. Records the energy envelope:
      utilization distribution, saturated slots, energy per request
      (sanity range vs DynamoLLM/TAPAS magnitudes).
